<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha — SnapGestão</title>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      background: #F4F6F9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { color: #0F5EA8; font-size: 22px; margin-bottom: 12px; }
    p { color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: block;
      background: #0F5EA8;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-decoration: none;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .info {
      background: #EFF6FF;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: #1e40af;
      margin-top: 20px;
    }
    footer { margin-top: 32px; color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔐</div>
    <h1>Redefinir sua senha</h1>
    <p id="msg">
      Clique no botão abaixo para abrir o
      <strong>SnapGestão</strong> e criar sua nova senha.
    </p>

    <a id="btnApp" class="btn" href="#">
      🫙 Abrir o SnapGestão
    </a>

    <div class="info">
      📱 O app precisa estar instalado no seu celular para continuar.
    </div>

    <footer>SnapGestão · Controle Financeiro Pessoal</footer>
  </div>

  <script>
    // Capturar todos os parâmetros da URL — Supabase pode usar hash (#) ou query (?)
    var hash   = window.location.hash.substring(1)   // remove o #
    var search = window.location.search.substring(1) // remove o ?

    // Construir deep link repassando os parâmetros originais ao app
    var deepLink = 'snapgestao://reset-password'
    if (search) deepLink += '?' + search
    if (hash)   deepLink += '#' + hash

    var btn = document.getElementById('btnApp')
    btn.href = deepLink

    btn.addEventListener('click', function (e) {
      e.preventDefault()
      window.location.href = deepLink

      setTimeout(function () {
        document.getElementById('msg').innerHTML =
          '⚠️ O app não abriu automaticamente. ' +
          'Certifique-se de que o SnapGestão está instalado e tente novamente.'
      }, 3000)
    })

    // Tentar abrir o app automaticamente após 500ms
    setTimeout(function () {
      window.location.href = deepLink
    }, 500)
  </script>
</body>
</html>
