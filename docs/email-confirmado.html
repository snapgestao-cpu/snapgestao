<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmado — SnapGestão</title>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      background: #F4F6F9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #0F5EA8; font-size: 22px; margin-bottom: 12px; }
    p {
      color: #666;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      background: #D1FAE5;
      color: #065F46;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      display: inline-block;
    }
    footer { margin-top: 32px; color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Email confirmado!</h1>
    <p>
      Seu email foi verificado com sucesso.
      Agora você pode abrir o
      <strong>SnapGestão</strong>
      no seu celular e começar a
      controlar suas finanças.
    </p>
    <span class="badge">🫙 Abra o app no celular</span>
    <footer>
      SnapGestão · Controle que transforma
    </footer>
  </div>
</body>
</html>
